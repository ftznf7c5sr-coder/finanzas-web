<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>Finanzas</title>
  </head>
  <body>
    <!-- Splash de carga mientras Firebase restaura la sesión -->
    <div id="app-splash" style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:9999">
      <div style="width:44px;height:44px;border:4px solid #e0e0e0;border-top-color:#1976d2;border-radius:50%;animation:splash-spin 0.8s linear infinite"></div>
      <span style="color:#757575;font-family:sans-serif;font-size:14px;letter-spacing:.5px">Cargando...</span>
    </div>
    <style>@keyframes splash-spin{to{transform:rotate(360deg)}}</style>
    <!-- quasar:entry-point -->
  </body>
</html>
